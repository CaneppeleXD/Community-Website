<!DOCTYPE html>
<html lang="en">

<head>
    <title>All News</title>
    <meta charset="utf-8">
    <meta name="description" content="This is a website for news about League of Legends.">
    <meta name="author" content="João Canepelle">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="refresh" content="600">
    <meta name="keywords" content="All News">
    <link rel="stylesheet" type="text/css" href="../styles/commonStyles.css">
    <link rel="stylesheet" type="text/css" href="../styles/allNews.css">
    <link rel="icon" href="../assets/logo.jpg">
    <script type="text/javascript" src="../scripts/commonScripts.js" defer></script>
    <script type="text/javascript" src="../scripts/allNews.js" defer></script>
    <script type="text/javascript" src="../scripts/handlebars-v4.7.8.js"></script>
</head>

<body>
    <!-- Header is generated with Handlebars as the header id is "sub_page_header", to know more take a look into "commonScripts.js" file -->
    <header id="sub_page_header" class="header">all_news_header_link</header>

    <main>
        <h1 class="title">All News and Pages</h1>
        <!-- Declares the tamplate for the tile that shows the page's information -->
        <!-- The each helper states that one template will be generated for every instance of tile -->
        <script id="all_pages_display_template" type="template/handlebars">
            {{#each tile}}
                <a href="{{this.path}}">
                    <div class="page_item">
                        <img src="{{this.imagePath}}" alt="#this.imageAlt">
                        <div class="page_item_text">
                            <h2 class="page_item_title">{{this.title}}</h2>
                            <p class="page_item_desc">{{this.description}}</p>
                        </div>
                    </div>
                </a>
            {{/each}}
        </script>
        <div id="all_pages_display">
            <!-- Items are generated with Handlebars -->
        </div>
    </main>
    
    <!-- The footer's content is generated using Handlebars, so I don't need to change every footer's page every time I need to change something in it -->
    <footer id="footer"></footer>
</body>

</html>
